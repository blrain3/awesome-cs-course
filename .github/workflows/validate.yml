name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"

      - name: Validate README
        run: python scripts/validate_readme.py README.md

      - name: Run self-test
        run: python scripts/validate_readme.py --self-test
